# DHCP for devices on the travel Wi-Fi. DNS is AdGuard Home on 10.42.0.1:53 (deploy/adguard-install.sh),
# so dnsmasq's own DNS is off (port=0); devices are told to use 10.42.0.1.
interface=wlap
except-interface=lo
bind-dynamic
port=0
domain-needed
bogus-priv
resolv-file=/run/travelpi/resolv.conf
cache-size=1000
dhcp-range=10.42.0.20,10.42.0.200,255.255.255.0,12h
dhcp-option=option:router,10.42.0.1
dhcp-option=option:dns-server,10.42.0.1
dhcp-authoritative
# names like "travelpi" (→ 10.42.0.1) are rewrites in AdGuard Home
